<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="সব কাপড়ের সংগ্রহ — শাড়ি, পাঞ্জাবি, থ্রি-পিস, শার্ট">
  <title>সব কাপড় — আমার দোকান</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="siteHeader"></div>
<div id="drawerContainer"></div>

<section class="container" style="padding-top:30px;">
  <h1 class="section-title" id="pageTitle">সব কাপড়</h1>

  <div class="filter-bar">
    <input type="text" id="searchFilter" placeholder="🔍 নাম দিয়ে খুঁজুন...">
    <select id="categoryFilter">
      <option value="">সব ক্যাটাগরি</option>
    </select>
    <select id="sortSelect">
      <option value="newest">নতুন আগে</option>
      <option value="popular">জনপ্রিয় আগে</option>
      <option value="priceLow">দাম: কম → বেশি</option>
      <option value="priceHigh">দাম: বেশি → কম</option>
    </select>
  </div>

  <div style="margin-bottom:16px;color:var(--text-muted);font-size:0.9rem;">
    <span id="resultCount">লোড হচ্ছে...</span>
  </div>

  <div class="product-grid" id="productGrid">
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
  </div>
</section>

<div id="siteFooter"></div>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script type="module" src="js/shop.js"></script>
</body>
</html>
