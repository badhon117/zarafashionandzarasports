<body>

    <p id="heroTagline">মানসম্মত কাপড়ের বিশ্বস্ত ঠিকানা</p>
    <a href="shop.html" class="hero-btn">সব কাপড় দেখুন →</a>
  </div>
</section>

<section class="section container">
  <h2 class="section-title">ক্যাটাগরি</h2>
  <div class="category-grid" id="categoryGrid">
    <div class="skeleton" style="height:120px;"></div>
    <div class="skeleton" style="height:120px;"></div>
    <div class="skeleton" style="height:120px;"></div>
    <div class="skeleton" style="height:120px;"></div>
  </div>

  <h2 class="section-title">🔥 জনপ্রিয় কাপড়</h2>

    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
  </div>
  <div style="text-align:center; margin-top:30px;">
    <a href="shop.html" class="btn-outline">সব কাপড় দেখুন</a>

  <h2 class="section-title">✨ নতুন এসেছে</h2>
  <div class="product-grid" id="newGrid"></div>
</section>

<section class="section container">
  <div style="background:linear-gradient(135deg, var(--primary), var(--accent)); border-radius:var(--radius); padding:40px 24px; text-align:center; color:white;">
    <h2 style="margin-bottom:12px; font-size:1.6rem;">📍 দোকানে এসে দেখুন</h2>
    <p id="visitInfo" style="margin-bottom:20px; opacity:0.95;"></p>
    <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">

      <a href="#" id="waBtn" target="_blank" class="hero-btn" style="background:#25d366; color:white;">💬 WhatsApp</a>
    </div>
  </div>

<div id="siteFooter"></div>

<script src="js/config.js"></script>
<script src="js/main.js"></script>
